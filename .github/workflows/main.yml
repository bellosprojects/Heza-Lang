name: Heza CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # El CD se activará solo cuando crees un tag como v1.0.0

permissions:
  contents: write

jobs:
  # ==========================================
  # FASE 1: INTEGRACIÓN CONTINUA (CI)
  # ==========================================
  test:
    name: Build & Test
    runs-on: windows-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' # Ajusta a la versión que utilices

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pybind11 pyinstaller sympy keyboard setuptools pybind11_stubgen
          
          cd HSCE
          python setup.py build_ext --inplace
          cd ..

      - name: Prueba de código puro
        run: python heza.py .\tests\test.hz

  # ==========================================
  # FASE 2: DESPLIEGUE CONTINUO (CD)
  # ==========================================
  release:
    name: Build, Package & Release
    needs: test # Solo se ejecuta si las pruebas pasan
    if: startsWith(github.ref, 'refs/tags/') # Solo se ejecuta al crear un Tag (v*)
    runs-on: windows-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python y Dependencias
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Compilar C++ y preparar entorno
        run: |
          pip install pybind11 pyinstaller sympy keyboard setuptools pybind11_stubgen
          cd HSCE
          python setup.py build_ext --inplace
          cd ..

      - name: Empaquetar con PyInstaller
        run: pyinstaller heza.spec

      - name: Mover ejecutable a carpeta setup
        run: Move-Item -Path "dist\heza.exe" -Destination "setup\heza.exe" -Force

      - name: Prueba del ejecutable aislado
        run: .\setup\heza.exe .\tests\test.hz

      - name: Instalar y compilar Inno Setup
        run: |
          choco install innosetup
          iscc setup\main.iss

      - name: Prueba de la instalación (Instalación Silenciosa)
        run: |
          # Instalamos el exe generado silenciosamente para probarlo en el sistema
          .\setup\Output\HezaSetup-Windows.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: setup/Output/HezaSetup-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}