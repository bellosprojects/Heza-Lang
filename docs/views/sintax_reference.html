<!DOCTYPE html>
<html lang="es" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heza Lang - Documentacion</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../sintax.css">


    <link rel="shortcut icon" href="../assets/HezaLogo.ico" type="image/x-icon">
    
    <!-- Google Fonts: Inter, Space Grotesk & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        heza: {
                            bg: '#03060a',
                            surface: '#0a111a',
                            card: '#0e1726',
                            cyan: '#00E5FF',
                            cyanGlow: 'rgba(0, 229, 255, 0.15)',
                            teal: '#0088AA',
                            textMuted: '#8b9bb4'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #03060a;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: fixed;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.03) 0%, rgba(3, 6, 10, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            top: -20%;
            left: -10%;
        }

        /* Glassmorphism Header & Sidebar */
        .glass-panel {
            background: rgba(10, 17, 26, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(0, 229, 255, 0.08);
            border-bottom: 1px solid rgba(0, 229, 255, 0.08);
        }

        /* Premium Luxury Card Styling */
        .luxury-card {
            background: linear-gradient(145deg, rgba(14, 23, 38, 0.6) 0%, rgba(5, 9, 15, 0.8) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 136, 170, 0.2);
            border-radius: 1rem;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        .luxury-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 1rem;
            padding: 1px;
            background: linear-gradient(180deg, rgba(0,229,255,0.3) 0%, rgba(0,229,255,0) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.4s ease;
        }
        .luxury-card:hover {
            border-color: rgba(0, 229, 255, 0.5);
            box-shadow: 0 10px 40px -10px rgba(0, 229, 255, 0.15);
            transform: translateY(-2px);
        }
        .luxury-card:hover::before {
            opacity: 1;
        }

        /* Code Editor Mockup Styling */
        .code-container {
            background: #010306;
            border: 1px solid rgba(0, 136, 170, 0.25);
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
        }
        .code-header {
            background: rgba(0, 136, 170, 0.1);
            border-bottom: 1px solid rgba(0, 136, 170, 0.2);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #03060a; }
        ::-webkit-scrollbar-thumb { 
            background: #0a111a; 
            border: 1px solid rgba(0, 229, 255, 0.2); 
            border-radius: 8px; 
        }
        ::-webkit-scrollbar-thumb:hover { background: #0088AA; }

        /* Sidebar Link Active State */
        .nav-link.active {
            color: #00E5FF;
            font-weight: 500;
            border-left-color: #00E5FF;
            background: linear-gradient(90deg, rgba(0, 229, 255, 0.1) 0%, transparent 100%);
        }
    </style>
</head>
<body class="font-sans antialiased text-slate-300">

    <div class="ambient-glow"></div>

    <!-- Mobile Header -->
    <header class="lg:hidden fixed top-0 left-0 right-0 h-16 glass-panel z-50 flex items-center justify-between px-4">
        <div class="flex items-center gap-3">
            <span class="font-heading font-bold text-lg text-white tracking-wide">
                HEZA <span class="text-heza-cyan font-light">Docs</span>
            </span>
        </div>
        <button id="mobile-menu-btn" class="p-2 text-heza-cyan focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </header>

    <div class="flex min-h-screen pt-16 lg:pt-0 relative z-10">

        <!-- Fixed Left Sidebar -->
        <aside id="sidebar" class="fixed top-0 left-0 h-screen w-72 glass-panel z-40 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 overflow-y-auto flex flex-col pt-16 lg:pt-0">
            
            <!-- Desktop Logo -->
            <div class="hidden lg:flex items-center h-20 px-8 border-b border-heza-cyan/10 shrink-0">
                <span class="font-heading font-bold text-2xl text-white tracking-widest">
                    HEZA<span class="text-heza-cyan"> Docs</span>
                </span>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 px-6 py-8 space-y-8 text-sm" id="nav-bar">
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 lg:ml-72 min-h-screen">
            <div class="max-w-5xl mx-auto px-6 py-12 lg:py-20 space-y-20" id="docs-container">
                
                <!-- Page Title -->
                <div class="mb-16">
                    <span class="font-mono text-heza-cyan text-xs uppercase tracking-[0.2em] block mb-3">Documentación Oficial</span>
                    <h1 class="text-4xl md:text-5xl font-heading font-bold text-white mb-4">Referencia de Sintaxis</h1>
                    <p class="text-heza-textMuted text-lg max-w-2xl">
                        Aprende la sintaxis de Heza. Utiliza las siguientes tarjetas como guía oficial para dominar las bases, variables, operadores matemáticos y estructuras del lenguaje.
                    </p>
                </div>

            </div>
        </main>
    </div>

    <script type="module" src="../scripts/docs.js"></script>
</body>
</html>
